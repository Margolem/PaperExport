name: PaperExport
version: 1.0.2
main: dev.paperexport.PaperExportPlugin
api-version: '1.21'
description: Data-driven custom entities for Paper
commands:
  paperexport:
    description: Manage PaperExport entities
    aliases: [pe]
permissions:
  paperexport.admin:
    default: op
  paperexport.spawn:
    default: op
  paperexport.reload:
    default: op
  paperexport.debug:
    default: op
